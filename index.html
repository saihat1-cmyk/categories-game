<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>بنت وولد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12213A;
    --surface:#1B2E4D;
    --surface-2:#23375A;
    --surface-3:#2D4470;
    --accent:#F2A93B;
    --accent-dim:#8a6a2c;
    --urgent:#E85A4F;
    --good:#F2A93B;
    --shared:#37B7A6;
    --zero:#5A6B85;
    --text:#F5F2EA;
    --text-dim:#A9B7CE;
    --border:#33507E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100%;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding:20px 18px 40px; display:flex; flex-direction:column;}
  h1,h2,h3{font-family:'Cairo',sans-serif; margin:0;}
  button{font-family:'Tajawal',sans-serif; cursor:pointer; border:none;}
  input{font-family:'Tajawal',sans-serif;}
  ::selection{background:var(--accent); color:#12213A;}

  .btn{
    display:block; width:100%; padding:16px; border-radius:16px; font-size:17px; font-weight:700;
    text-align:center; transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent); color:#1B1206;}
  .btn-primary:disabled{background:var(--surface-3); color:var(--text-dim); cursor:not-allowed;}
  .btn-outline{background:transparent; color:var(--text); border:2px solid var(--border);}
  .btn-danger-outline{background:transparent; color:var(--urgent); border:2px solid var(--urgent);}
  .btn-sm{padding:10px 16px; font-size:14px; border-radius:12px; width:auto; display:inline-block;}

  input[type=text]{
    width:100%; padding:15px 16px; border-radius:14px; border:2px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:16px; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}

  .stack{display:flex; flex-direction:column; gap:12px;}
  .row{display:flex; align-items:center; gap:10px;}
  .spacer{flex:1;}
  .center{text-align:center;}
  .muted{color:var(--text-dim);}
  .small{font-size:13px;}

  /* ---------- Home ---------- */
  .home-hero{margin:36px 0 28px; text-align:center;}
  .tile-row{display:flex; justify-content:center; gap:10px; margin-bottom:18px;}
  .hero-tile{
    width:52px; height:52px; border-radius:12px; background:var(--surface-2); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-family:'Cairo',sans-serif; font-weight:900; font-size:26px;
    transform:rotate(var(--r,0deg));
  }
  .home-title{font-size:34px; font-weight:900; margin-bottom:6px;}
  .home-sub{color:var(--text-dim); font-size:15px; line-height:1.7;}
  .card{background:var(--surface); border-radius:20px; padding:20px; border:1px solid var(--border);}
  .mode-toggle{display:flex; background:var(--surface-2); border-radius:14px; padding:4px; margin-bottom:16px;}
  .mode-toggle button{flex:1; padding:10px; border-radius:11px; background:transparent; color:var(--text-dim); font-weight:700;}
  .mode-toggle button.active{background:var(--accent); color:#1B1206;}

  /* ---------- Lobby ---------- */
  .room-code-box{background:var(--surface); border:2px dashed var(--accent); border-radius:18px; padding:22px; text-align:center; margin-bottom:18px;}
  .room-code{font-family:'Cairo',sans-serif; font-size:42px; font-weight:900; letter-spacing:6px; color:var(--accent);}
  .player-chip{
    background:var(--surface-2); border-radius:14px; padding:13px 16px; display:flex; align-items:center; gap:10px;
  }
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--accent); color:#1B1206; font-weight:900;
    display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;
  }
  .host-badge{font-size:11px; background:var(--accent-dim); color:var(--accent); padding:3px 8px; border-radius:8px; font-weight:700;}

  /* ---------- Playing ---------- */
  .letter-wrap{text-align:center; margin:6px 0 18px;}
  .letter-tile{
    width:96px; height:96px; border-radius:22px; background:linear-gradient(160deg, var(--accent), #d98f22);
    color:#1B1206; font-family:'Cairo',sans-serif; font-weight:900; font-size:52px;
    display:flex; align-items:center; justify-content:center; margin:0 auto 10px;
    box-shadow:0 8px 24px rgba(242,169,59,.25);
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.4) rotate(-12deg); opacity:0;} to{transform:scale(1) rotate(0); opacity:1;}}
  .timer-track{height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin:14px 0 4px;}
  .timer-fill{height:100%; border-radius:6px; background:var(--good); transition:width 1s linear, background .3s ease;}
  .timer-label{font-family:'Cairo',sans-serif; font-weight:800; font-size:15px;}

  .cat-row{background:var(--surface); border-radius:16px; padding:12px 14px; border:1px solid var(--border);}
  .cat-label{display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:8px; font-size:14px;}
  .cat-input{width:100%; padding:12px 14px; border-radius:12px; border:2px solid var(--border); background:var(--surface-2); color:var(--text); font-size:16px; outline:none;}
  .cat-input:focus{border-color:var(--accent);}
  .cat-input.invalid{border-color:var(--urgent);}
  .cat-hint{font-size:11px; color:var(--urgent); margin-top:5px; min-height:14px;}

  .ready-count{font-size:13px; color:var(--text-dim); text-align:center; margin-top:2px;}

  /* ---------- Results ---------- */
  .rank-card{background:var(--surface); border-radius:16px; padding:14px 16px; border:1px solid var(--border); cursor:pointer;}
  .rank-card.first{border-color:var(--accent); background:linear-gradient(180deg, rgba(242,169,59,.14), var(--surface));}
  .rank-num{
    width:30px; height:30px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:900; font-size:14px; flex-shrink:0;
  }
  .rank-num.gold{background:var(--accent); color:#1B1206;}
  .pts{font-weight:900; font-family:'Cairo',sans-serif;}
  .pts.p10{color:var(--good);}
  .pts.p5{color:var(--shared);}
  .pts.p0{color:var(--zero);}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:70;}
  .modal-card{background:var(--surface); width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:20px 18px 30px; max-height:78vh; overflow-y:auto;}
  .modal-close{width:32px; height:32px; border-radius:50%; background:var(--surface-2); color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .breakdown-item{padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06);}
  .breakdown-item-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .edit-pts{display:flex; gap:6px; margin-top:8px;}
  .edit-pts button{flex:1; padding:7px; border-radius:9px; background:var(--surface-2); color:var(--text-dim); font-size:12px; font-weight:700;}
  .edit-pts button.active{background:var(--accent); color:#1B1206;}

  .banner{background:var(--surface-2); border-right:4px solid var(--urgent); border-radius:10px; padding:12px 14px; font-size:13.5px; color:var(--text);}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface-3); color:var(--text); padding:12px 20px; border-radius:14px; font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,.35); z-index:50;}

  .top-bar{display:flex; align-items:center; margin-bottom:18px;}
  .top-bar .room-pill{background:var(--surface-2); padding:6px 14px; border-radius:999px; font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; letter-spacing:2px; color:var(--accent);}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const DB_URL = "https://hussain-alyousef-default-rtdb.firebaseio.com";
  const GAME_PATH = "/categories-game";

  const CATEGORIES = [
    {key:"girl",    label:"بنت",         emoji:"👧"},
    {key:"boy",     label:"ولد",         emoji:"👦"},
    {key:"animal",  label:"حيوان",       emoji:"🐾"},
    {key:"object",  label:"جماد",        emoji:"🧱"},
    {key:"food",    label:"أكل",         emoji:"🍽️"},
    {key:"country", label:"بلاد / مدينة", emoji:"🌍"},
  ];

  const LETTERS = ["ا","ب","ت","ث","ج","ح","خ","د","ر","ز","س","ش","ص","ض","ط","ع","غ","ف","ق","ك","ل","م","ن","ه","و","ي"];
  const ROUND_DURATION = 90; // seconds

  // ---------------- state ----------------
  let screen = "home"; // home | lobby | playing | results
  function getOrCreatePlayerId(){
    try{
      let pid = localStorage.getItem("catgame_playerId");
      if(!pid){ pid = "p_" + Math.random().toString(36).slice(2, 10); localStorage.setItem("catgame_playerId", pid); }
      return pid;
    }catch(e){ return "p_" + Math.random().toString(36).slice(2, 10); }
  }
  function getSavedName(){ try{ return localStorage.getItem("catgame_playerName") || ""; }catch(e){ return ""; } }
  function saveName(name){ try{ localStorage.setItem("catgame_playerName", name); }catch(e){} }

  let playerId = getOrCreatePlayerId();
  let playerName = "";
  let roomCode = null;
  let room = null; // last fetched room doc
  let pollTimer = null;
  let tickTimer = null;
  let serverOffset = 0; // serverTime - Date.now()
  let isHost = false;
  let expandedPlayer = null;
  let renderedRoundKey = null; // to know when to rebuild the playing-screen DOM
  let localAnswers = {}; // buffered local edits (playerId is always me here)
  let saveTimers = {};
  let errorBanner = null;
  let visibilityListenerAdded = false;
  let selectedDuration = 90;
  let audioCtx = null;
  let lastWarnSecond = null;
  let endBeepPlayed = false;
  let chatOpen = false;
  let knownChatIds = new Set();
  let unreadChatCount = 0;

  // ---------------- audio ----------------
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }
    return audioCtx;
  }
  function unlockAudio(){
    const ctx = ensureAudio();
    if(ctx && ctx.state === "suspended"){ ctx.resume().catch(()=>{}); }
  }
  function beep(freq, dur, vol){
    const ctx = ensureAudio(); if(!ctx) return;
    if(ctx.state === "suspended"){ ctx.resume().catch(()=>{}); }
    try{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.value = vol||0.18;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      osc.stop(ctx.currentTime + dur);
    }catch(e){}
  }
  function playWarningBeep(){ beep(920, 0.16, 0.55); }
  function playEndBeep(){ beep(260, 0.4, 0.6); setTimeout(()=>beep(180, 0.45, 0.6), 160); }
  function playCelebrationSound(){
    [440,554,659,880,1046].forEach((f,i)=> setTimeout(()=>beep(f, 0.28, 0.2), i*130));
  }
  function playChatPing(){ beep(700, 0.1, 0.16); setTimeout(()=>beep(900, 0.1, 0.14), 90); }

  // ---------------- background music (procedural, generated locally — no external files) ----------------
  let bgMusicPlaying = false;
  let bgMusicMuted = false;
  let bgMusicTimer = null;
  let bgMusicStep = 0;
  const BG_STEP_MS = 60000 / 128 / 2; // 128bpm, eighth notes — driving but not distracting
  const BG_SCALE = [220.00, 246.94, 261.63, 293.66, 329.63, 392.00]; // A minor-ish, focused/tense feel
  const BG_PATTERN = [0,null,2,null,3,null,2,null, 4,null,3,null,1,null,2,null];
  function playBgNote(freq, dur, vol, type){
    const ctx = ensureAudio(); if(!ctx) return;
    if(ctx.state === "suspended"){ ctx.resume().catch(()=>{}); }
    try{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "triangle";
      osc.frequency.value = freq;
      gain.gain.value = 0;
      osc.connect(gain); gain.connect(ctx.destination);
      const now = ctx.currentTime;
      gain.gain.linearRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.start(now);
      osc.stop(now + dur + 0.05);
    }catch(e){}
  }
  function bgMusicTick(){
    if(!bgMusicPlaying) return;
    if(!bgMusicMuted){
      const step = bgMusicStep % 16;
      if(step % 8 === 0){ playBgNote(110, 0.4, 0.16, "sine"); } // low pulse
      const idx = BG_PATTERN[step];
      if(idx !== null){ playBgNote(BG_SCALE[idx], 0.3, 0.11, "triangle"); } // melodic layer
    }
    bgMusicStep++;
    bgMusicTimer = setTimeout(bgMusicTick, BG_STEP_MS);
  }
  function startBgMusic(){
    if(bgMusicPlaying) return;
    unlockAudio();
    bgMusicPlaying = true;
    bgMusicStep = 0;
    bgMusicTick();
  }
  function stopBgMusic(){
    bgMusicPlaying = false;
    if(bgMusicTimer) clearTimeout(bgMusicTimer);
    bgMusicTimer = null;
  }
  function syncBgMusic(){
    const activeStates = ["playing","results"];
    if(activeStates.includes(screen) && !bgMusicMuted){
      startBgMusic();
    }else{
      stopBgMusic();
    }
  }
  function toggleBgMusicMute(){
    unlockAudio();
    bgMusicMuted = !bgMusicMuted;
    syncBgMusic();
    updateMusicButton();
  }
  function updateMusicButton(){
    const btn = qs("#musicToggleBtn");
    if(btn) btn.textContent = bgMusicMuted ? "🔇" : "🎵";
  }

  // ---------------- helpers ----------------
  function el(html){
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  function qs(sel, root){ return (root||document).querySelector(sel); }
  function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }

  function normText(s){
    if(!s) return "";
    return s
      .trim()
      .replace(/[\u064B-\u0652\u0670]/g,"") // tashkeel
      .replace(/[أإآٱ]/g,"ا")
      .replace(/ى/g,"ي")
      .replace(/ة/g,"ه")
      .replace(/\s+/g," ")
      .toLowerCase();
  }
  function normChar(c){ return normText(c); }

  function showToast(msg, ms){
    const old = qs(".toast"); if(old) old.remove();
    const t = el(`<div class="toast">${msg}</div>`);
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), ms||2200);
  }

  async function fetchWithTimeout(url, opts, ms){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), ms||8000);
    try{
      return await fetch(url, {...(opts||{}), signal: ctrl.signal});
    }catch(e){
      if(e.name === "AbortError") throw new Error("timeout: انتهت المهلة بدون رد من الخادم");
      throw e;
    }finally{
      clearTimeout(timer);
    }
  }
  async function dbGet(path){
    const bust = `_=${Date.now()}${Math.random().toString(36).slice(2,6)}`;
    const res = await fetchWithTimeout(`${DB_URL}${path}.json?${bust}`, { cache: "no-store" });
    if(!res.ok){ const t = await res.text().catch(()=> ""); throw new Error(`GET ${res.status}: ${t}`); }
    return res.json();
  }
  async function dbPatch(path, body){
    const res = await fetchWithTimeout(`${DB_URL}${path}.json`, {
      method:"PATCH", body: JSON.stringify(body)
    });
    if(!res.ok){ const t = await res.text().catch(()=> ""); throw new Error(`PATCH ${res.status}: ${t}`); }
    return res.json();
  }
  async function dbPut(path, body){
    const res = await fetchWithTimeout(`${DB_URL}${path}.json`, {
      method:"PUT", body: JSON.stringify(body)
    });
    if(!res.ok){ const t = await res.text().catch(()=> ""); throw new Error(`PUT ${res.status}: ${t}`); }
    return res.json();
  }
  async function dbDelete(path){
    const res = await fetchWithTimeout(`${DB_URL}${path}.json`, { method:"DELETE" });
    if(!res.ok){ const t = await res.text().catch(()=> ""); throw new Error(`DELETE ${res.status}: ${t}`); }
    return res.json();
  }
  async function dbPost(path, body){
    const res = await fetchWithTimeout(`${DB_URL}${path}.json`, { method:"POST", body: JSON.stringify(body) });
    if(!res.ok){ const t = await res.text().catch(()=> ""); throw new Error(`POST ${res.status}: ${t}`); }
    return res.json(); // { name: "-generatedPushId" }
  }

  async function calibrateClock(){
    try{
      const path = `${GAME_PATH}/_ping/${playerId}`;
      await dbPut(path, {t:{".sv":"timestamp"}});
      const t0 = Date.now();
      const data = await dbGet(path);
      const serverTime = data && data.t ? data.t : Date.now();
      serverOffset = serverTime - t0;
      dbDelete(path).catch(()=>{});
    }catch(e){ serverOffset = 0; }
  }
  function nowServer(){ return Date.now() + serverOffset; }

  // ---------------- room actions ----------------
  function genCode(){ return String(Math.floor(1000 + Math.random()*9000)); }

  async function createRoom(name){
    playerName = name;
    let code = genCode();
    try{
      let attempts = 0;
      while(attempts < 5){
        const exists = await dbGet(`${GAME_PATH}/rooms/${code}`);
        if(!exists) break;
        code = genCode(); attempts++;
      }
    }catch(e){ /* if check fails, proceed anyway */ }
    isHost = true;
    const initial = {
      hostId: playerId,
      createdAt: {".sv":"timestamp"},
      state: "lobby",
      roundNumber: 0,
      roundDuration: ROUND_DURATION,
      currentLetter: null,
      usedLetters: {},
      players: { [playerId]: { name: playerName, joinedAt: {".sv":"timestamp"} } },
      rounds: {}
    };
    try{
      await dbPut(`${GAME_PATH}/rooms/${code}`, initial);
      roomCode = code;
      room = initial;
      screen = "lobby";
      startPolling();
      render();
    }catch(e){ showError(); }
  }

  async function joinRoom(code, name){
    playerName = name;
    try{
      const existing = await dbGet(`${GAME_PATH}/rooms/${code}`);
      if(!existing){ showToast("ما لقيت غرفة بهذا الكود، تأكد منه 🤔"); return; }
      await dbPatch(`${GAME_PATH}/rooms/${code}/players/${playerId}`, { name: playerName, joinedAt:{".sv":"timestamp"} });
      const fresh = await dbGet(`${GAME_PATH}/rooms/${code}`);
      roomCode = code;
      room = fresh;
      knownChatIds = new Set(Object.keys(fresh.chat||{}));
      isHost = (fresh.hostId === playerId);
      screen = fresh.state || "lobby";
      startPolling();
      render();
    }catch(e){ showError(); }
  }

  async function leaveRoom(){
    stopPolling();
    try{ await dbDelete(`${GAME_PATH}/rooms/${roomCode}/players/${playerId}`); }catch(e){}
    roomCode = null; room = null; isHost = false; screen = "home"; renderedRoundKey = null; expandedPlayer = null;
    knownChatIds = new Set(); unreadChatCount = 0;
    render();
  }

  function pickLetter(usedLetters){
    usedLetters = usedLetters || {};
    let pool = LETTERS.filter(l => !usedLetters[l]);
    let resetHappened = false;
    if(pool.length === 0){
      pool = LETTERS.slice();
      resetHappened = true;
    }
    const letter = pool[Math.floor(Math.random()*pool.length)];
    return { letter, resetHappened };
  }

  async function startRound(){
    if(!room) return;
    const nextRound = (room.roundNumber||0) + 1;
    const { letter, resetHappened } = pickLetter(room.usedLetters);
    const newUsedLetters = resetHappened ? { [letter]: true } : { ...(room.usedLetters||{}), [letter]: true };
    try{
      await dbPatch(`${GAME_PATH}/rooms/${roomCode}`, {
        state:"playing",
        currentLetter: letter,
        usedLetters: newUsedLetters,
        roundNumber: nextRound,
        roundDuration: selectedDuration,
        roundStartTime: {".sv":"timestamp"},
        answers: null,
        ready: null
      });
      const fresh = await dbGet(`${GAME_PATH}/rooms/${roomCode}`);
      room = fresh; screen = "playing"; render();
    }catch(e){ showError(); }
  }

  function scheduleSave(catKey){
    clearTimeout(saveTimers[catKey]);
    saveTimers[catKey] = setTimeout(async ()=>{
      try{
        await dbPatch(`${GAME_PATH}/rooms/${roomCode}/answers/${playerId}`, { [catKey]: localAnswers[catKey]||"" });
      }catch(e){ /* silent, will retry on next keystroke */ }
    }, 450);
  }

  async function toggleReady(){
    for(let attempt=0; attempt<4; attempt++){
      try{
        await dbPut(`${GAME_PATH}/rooms/${roomCode}/ready/${playerId}`, true);
        return true;
      }catch(e){
        await new Promise(r=>setTimeout(r, 500 + attempt*500));
      }
    }
    return false;
  }


  function computeScores(roomData){
    const players = Object.keys(roomData.players||{});
    const answers = roomData.answers || {};
    const letter = roomData.currentLetter;
    const result = {}; // playerId -> {perCategory, total}
    players.forEach(pid => result[pid] = { perCategory:{}, total:0 });

    CATEGORIES.forEach(cat => {
      // collect normalized valid answers per player for this category
      const norm = {}; // pid -> normalized text (only if valid & non-empty)
      players.forEach(pid => {
        const raw = (answers[pid] && answers[pid][cat.key]) || "";
        const nText = normText(raw);
        if(!nText){ return; }
        const validStart = nText[0] === normChar(letter);
        if(validStart) norm[pid] = nText;
      });
      // count frequency
      const freq = {};
      Object.values(norm).forEach(v => { freq[v] = (freq[v]||0) + 1; });
      players.forEach(pid => {
        const raw = (answers[pid] && answers[pid][cat.key]) || "";
        let pts = 0;
        if(norm[pid]){
          pts = freq[norm[pid]] === 1 ? 10 : 5;
        }
        result[pid].perCategory[cat.key] = { answer: raw, points: pts };
        result[pid].total += pts;
      });
    });
    return result;
  }

  async function finalizeRound(){
    if(!room || room.state !== "playing") return;
    const roundNum = room.roundNumber;
    const roundKey = "r" + roundNum;
    const letter = room.currentLetter;
    const scores = computeScores(room);
    try{
      await dbPatch(`${GAME_PATH}/rooms/${roomCode}`, {
        state: "results",
        [`rounds/${roundKey}`]: { letter, scores }
      });
      room = { ...room, state: "results", rounds: { ...(room.rounds||{}), [roundKey]: { letter, scores } } };
      screen = "results";
      render();
    }catch(e){
      console.error("finalizeRound failed:", e);
    }
  }

  async function overridePoints(pid, catKey, newPoints){
    if(!isHost || !room) return;
    const roundKey = "r" + room.roundNumber;
    const roundData = room.rounds && room.rounds[roundKey];
    if(!roundData || !roundData.scores || !roundData.scores[pid]) return;
    const s = roundData.scores[pid];
    const updatedPerCategory = { ...s.perCategory, [catKey]: { ...s.perCategory[catKey], points: newPoints } };
    const newTotal = Object.values(updatedPerCategory).reduce((sum,c)=> sum + (c.points||0), 0);
    const updatedPlayerScore = { perCategory: updatedPerCategory, total: newTotal };
    try{
      await dbPatch(`${GAME_PATH}/rooms/${roomCode}/rounds/${roundKey}/scores/${pid}`, updatedPlayerScore);
      room = { ...room, rounds: { ...room.rounds, [roundKey]: { ...roundData, scores: { ...roundData.scores, [pid]: updatedPlayerScore } } } };
      render();
    }catch(e){ showToast("تعذّر حفظ التعديل، جرب مرة ثانية 🙏"); }
  }

  function computeTotals(roomData){
    const players = Object.entries(roomData.players||{});
    const totals = {};
    players.forEach(([pid])=> totals[pid] = 0);
    Object.values(roomData.rounds||{}).filter(Boolean).forEach(r=>{
      Object.entries(r.scores||{}).forEach(([pid, s])=>{
        if(totals[pid] === undefined) totals[pid] = 0;
        totals[pid] += s.total;
      });
    });
    return players.map(([pid,p])=>({pid, name:p.name, total: totals[pid]||0}))
      .sort((a,b)=> b.total - a.total);
  }

  async function endGame(){
    if(!room) return;
    const ranked = computeTotals(room);
    const winnerId = ranked.length ? ranked[0].pid : null;
    try{
      await dbPatch(`${GAME_PATH}/rooms/${roomCode}`, { state:"finished", winnerId });
      room = { ...room, state:"finished", winnerId };
      screen = "finished";
      playCelebrationSound();
      render();
    }catch(e){ showError(); }
  }

  // ---------------- polling ----------------
  async function pollOnce(){
    try{
      const data = await dbGet(`${GAME_PATH}/rooms/${roomCode}`);
      if(!data){ showToast("انتهت الغرفة أو تم حذفها"); leaveRoom(); return; }
      if(data.players && !data.players[playerId]){
        showToast("تم إزالتك من الغرفة من قبل المضيف 😕");
        stopPolling();
        roomCode = null; room = null; isHost = false; screen = "home"; renderedRoundKey = null; expandedPlayer = null;
        knownChatIds = new Set(); unreadChatCount = 0;
        render();
        return;
      }
      const prevScreen = screen;
      room = data;
      isHost = (room.hostId === playerId);
      if(screen !== "playing" || room.state !== "playing"){
        screen = room.state || "lobby";
      }
      if(prevScreen !== "finished" && screen === "finished"){ playCelebrationSound(); }

      let newFromOthers = false;
      Object.keys(room.chat||{}).forEach(id=>{
        if(!knownChatIds.has(id)){
          knownChatIds.add(id);
          const m = room.chat[id];
          if(m && m.pid !== playerId){
            newFromOthers = true;
            if(!chatOpen) unreadChatCount++;
          }
        }
      });
      if(newFromOthers && !chatOpen){ playChatPing(); }

      errorBanner = null;
      render();
      if(chatOpen) renderChatMessages();
      updateChatBadge();
    }catch(e){ errorBanner = "تعذّر الاتصال بالخادم — بيعاد المحاولة تلقائيًا"; render(); }
  }
  function startPolling(){
    stopPolling();
    pollTimer = setInterval(pollOnce, 1200);

    tickTimer = setInterval(()=>{
      if(audioCtx && audioCtx.state === "suspended"){ audioCtx.resume().catch(()=>{}); }
      if(room && room.state === "playing"){
        updateTimerUI();
        checkAutoEnd();
      }
    }, 500);

    if(!visibilityListenerAdded){
      visibilityListenerAdded = true;
      document.addEventListener("visibilitychange", ()=>{
        if(document.visibilityState === "visible" && roomCode){
          unlockAudio();
          pollOnce();
        }
      });
    }
  }
  function stopPolling(){
    if(pollTimer) clearInterval(pollTimer);
    if(tickTimer) clearInterval(tickTimer);
    pollTimer = null; tickTimer = null;
  }

  let finalizeLock = false;
  function checkAutoEnd(){
    if(!room || room.state !== "playing" || !room.roundStartTime) return;
    const players = Object.keys(room.players||{});
    const readyCount = room.ready ? Object.keys(room.ready).length : 0;
    let shouldEnd;
    if(room.roundDuration === "first"){
      shouldEnd = readyCount >= 1;
    }else{
      const elapsed = (nowServer() - room.roundStartTime)/1000;
      const remaining = room.roundDuration - elapsed;
      const allReady = players.length > 0 && readyCount >= players.length;
      shouldEnd = remaining <= 0 || allReady;
    }
    if(shouldEnd && !finalizeLock){
      finalizeLock = true;
      finalizeRound().finally(()=>{ setTimeout(()=>finalizeLock=false, 3000); });
    }
  }
  function updateTimerUI(){
    if(!room || !room.roundStartTime) return;
    const fill = qs("#timerFill");
    const label = qs("#timerLabel");
    if(room.roundDuration === "first"){
      const elapsedSec = Math.floor((nowServer() - room.roundStartTime)/1000);
      if(fill){ fill.style.width = "100%"; fill.style.background = "var(--accent)"; }
      if(label){ label.textContent = "⚡ أول واحد يخلص — " + elapsedSec + " ث"; }
      return;
    }
    const elapsed = (nowServer() - room.roundStartTime)/1000;
    const remaining = Math.max(0, room.roundDuration - elapsed);
    if(fill){
      const pct = Math.max(0, (remaining/room.roundDuration)*100);
      fill.style.width = pct + "%";
      fill.style.background = remaining <= 15 ? "var(--urgent)" : "var(--good)";
    }
    if(label){ label.textContent = Math.ceil(remaining) + " ث"; }
    const intRemaining = Math.ceil(remaining);
    if(intRemaining <= 5 && intRemaining >= 1 && intRemaining !== lastWarnSecond){
      lastWarnSecond = intRemaining;
      playWarningBeep();
    }
    if(remaining <= 0 && !endBeepPlayed){
      endBeepPlayed = true;
      playEndBeep();
    }
  }

  function showError(){ showToast("صار خطأ بالاتصال، جرّب مرة ثانية 🙏"); }

  // ---------------- chat ----------------
  async function sendChatMessage(text){
    if(!text || !text.trim() || !roomCode) return;
    try{
      await dbPost(`${GAME_PATH}/rooms/${roomCode}/chat`, { pid: playerId, name: playerName, text: text.trim(), ts: {".sv":"timestamp"} });
    }catch(e){ showToast("تعذّر إرسال الرسالة، جرب مرة ثانية 🙏"); }
  }
  function renderChatMessages(){
    const container = qs("#chatMessages");
    if(!container || !room) return;
    const msgs = Object.entries(room.chat||{}).sort((a,b)=> a[0] < b[0] ? -1 : (a[0] > b[0] ? 1 : 0));
    if(msgs.length === 0){
      container.innerHTML = `<div class="muted small center" style="margin-top:20px;">ما فيه رسائل بعد، ابدأ الدردشة 👋</div>`;
      return;

      return `<div style="align-self:${mine?'flex-end':'flex-start'}; max-width:80%; background:${mine?'var(--accent)':'var(--surface-2)'}; color:${mine?'#1B1206':'var(--text)'}; padding:8px 12px; border-radius:14px; font-size:14px; word-break:break-word;">
        ${!mine ? `<div style="font-size:11px; opacity:.75; margin-bottom:2px; font-weight:700;">${m.name||""}</div>` : ``}
        <div>${m.text}</div>
      </div>`;
    }).join("");
    container.scrollTop = container.scrollHeight;
  }

    const o = qs("#chatOverlay"); if(o) o.remove();
  }

    if(qs("#chatOverlay")) return;
    const overlay = el(`
      <div class="modal-overlay" id="chatOverlay">
        <div class="modal-card" style="display:flex; flex-direction:column; height:66vh; padding-bottom:14px;">

      const val = input.value.trim();
      if(!val) return;
      input.value = "";

    };
    qs("#chatSendBtn").addEventListener("click", doSend);
    input.addEventListener("keydown", (e)=>{ if(e.key === "Enter"){ e.preventDefault(); doSend(); } });

  function toggleChat(){
    unlockAudio();
    chatOpen = !chatOpen;
    if(chatOpen){ unreadChatCount = 0; openChatOverlay(); } else { closeChatOverlay(); }
    updateChatBadge();
  }
  function updateChatBadge(){
    const fab = qs("#chatFab");
    if(!fab) return;
    let badge = qs("#chatBadge");
    if(unreadChatCount > 0 && !chatOpen){
      if(!badge){
        badge = el(`<div id="chatBadge" style="position:absolute; top:-4px; right:-4px; background:var(--urgent); color:#fff; font-size:11px; font-weight:800; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 5px;"></div>`);

  function ensureChatFab(){
    if(!roomCode){
      const b = qs("#chatFab"); if(b) b.remove();

        <div class="rank-card ${idx===0?'first':''}" data-pid="${r.pid}">
          <div class="row">
            <div class="rank-num ${idx===0?'gold':''}">${idx+1}</div>
            <div>
              <div style="font-weight:700;">${r.name}${r.pid===playerId?" (أنت)":""}</div>
              <div class="muted small">هذي الجولة: ${roundScore} نقطة</div>
            </div>
            <div class="spacer"></div>
            <div style="text-align:left;">
              <div class="pts p10" style="font-size:20px;">${r.total}</div>
              <div class="muted small">الإجمالي</div>
            </div>
          </div>
        </div>
      `);
      card.addEventListener("click", ()=>{
        expandedPlayer = expandedPlayer === r.pid ? null : r.pid;
        render();
      });
      list.appendChild(card);
    });

    if(isHost){
      wireDurationPicker();
      qs("#newRoundBtn").addEventListener("click", ()=>{ unlockAudio(); startRound(); });
      qs("#endGameBtn").addEventListener("click", ()=>{ unlockAudio(); endGame(); });
    }
    qs("#leaveBtn2").addEventListener("click", leaveRoom);

    // persistent detail modal — stays open across re-renders until explicitly closed
    if(expandedPlayer){
      const p = room.players && room.players[expandedPlayer];
      if(!p){
        expandedPlayer = null;
      }else{
        const s = roundData && roundData.scores && roundData.scores[expandedPlayer];
        const overlay = el(`
          <div class="modal-overlay" id="detailOverlay">
            <div class="modal-card">
              <div class="row" style="margin-bottom:14px;">
                <div style="font-weight:800; font-size:16px;">${p.name}</div>
                <div class="spacer"></div>
                <button class="modal-close" id="closeDetail">✕</button>
              </div>
              <div id="detailBody"></div>
            </div>
          </div>
        `);
        app.appendChild(overlay);
        const body = qs("#detailBody");
        if(!s){
          body.innerHTML = `<div class="muted small">ما فيه بيانات لهذه الجولة</div>`;
        }else{
          CATEGORIES.forEach(cat=>{
            const c = s.perCategory[cat.key] || {answer:"", points:0};
            const cls = c.points===10?"p10":c.points===5?"p5":"p0";
            const item = el(`
              <div class="breakdown-item">
                <div class="breakdown-item-top">
                  <span>${cat.emoji} ${c.answer||"—"}</span>
                  <span class="pts ${cls}">+${c.points}</span>
                </div>
                ${isHost ? `<div class="edit-pts" data-cat="${cat.key}">
                  <button data-val="0" class="${c.points===0?'active':''}">0</button>
                  <button data-val="5" class="${c.points===5?'active':''}">5</button>
                  <button data-val="10" class="${c.points===10?'active':''}">10</button>
                </div>` : ``}
              </div>
            `);
            body.appendChild(item);
          });
          if(isHost){
            qsa(".edit-pts button", body).forEach(btn=>{
              btn.addEventListener("click", ()=>{
                const catKey = btn.parentElement.dataset.cat;
                overridePoints(expandedPlayer, catKey, parseInt(btn.dataset.val));
              });
            });
          }
        }
        qs("#closeDetail").addEventListener("click", ()=>{ expandedPlayer = null; render(); });
      }
    }
  }

  function renderFinished(app){
    if(!room) return;
    const ranked = computeTotals(room);
    const winner = ranked[0];
    app.innerHTML = `
      <div class="center" style="margin:34px 0 10px;">
        <div style="font-size:64px;">🏆</div>
        <div style="font-family:'Cairo',sans-serif; font-weight:900; font-size:20px; margin-top:8px;">الفائز هو</div>
        <div style="font-family:'Cairo',sans-serif; font-weight:900; font-size:30px; color:var(--accent); margin-top:6px;">${winner ? winner.name : "—"}</div>
      </div>
      <div class="stack" id="finalList" style="margin-top:14px;"></div>
      <div style="margin-top:24px;">
        ${isHost ? `
          <button class="btn btn-primary" id="playAgainBtn">لعب من جديد 🔄</button>
          <button class="btn btn-outline" id="backToLobbyBtn" style="margin-top:10px;">العودة للغرفة</button>
        ` : `<div class="center muted small">بانتظار المضيف...</div>`}
        <button class="btn btn-danger-outline" id="leaveBtn3" style="margin-top:10px;">مغادرة الغرفة</button>
      </div>
    `;
    const list = qs("#finalList");
    ranked.forEach((r, idx)=>{
      list.appendChild(el(`
        <div class="rank-card ${idx===0?'first':''}">
          <div class="row">
            <div class="rank-num ${idx===0?'gold':''}">${idx+1}</div>
            <div style="font-weight:700;">${r.name}${r.pid===playerId?" (أنت)":""}</div>
            <div class="spacer"></div>
            <div class="pts p10" style="font-size:18px;">${r.total}</div>
          </div>
        </div>
      `));
    });
    if(isHost){
      qs("#playAgainBtn").addEventListener("click", async ()=>{
        unlockAudio();
        try{
          await dbPatch(`${GAME_PATH}/rooms/${roomCode}`, { state:"lobby", rounds: null, roundNumber: 0, currentLetter: null, winnerId: null, usedLetters: null });
          room = { ...room, state:"lobby", rounds:{}, roundNumber:0, currentLetter:null, winnerId:null, usedLetters:{} };
          screen = "lobby"; render();
        }catch(e){ showError(); }
      });
      qs("#backToLobbyBtn").addEventListener("click", async ()=>{
        try{
          await dbPatch(`${GAME_PATH}/rooms/${roomCode}`, { state:"lobby" });
          room = { ...room, state:"lobby" };
          screen = "lobby"; render();
        }catch(e){ showError(); }
      });
    }
    qs("#leaveBtn3").addEventListener("click", leaveRoom);
  }

  // ---------------- boot ----------------
  window.addEventListener("error", (e)=>{
    showToast("خطأ برمجي: " + (e.message||"غير معروف"), 9000);
  });
  window.addEventListener("unhandledrejection", (e)=>{
    showToast("خطأ غير متوقع: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)), 9000);
  });
  calibrateClock();
  render();
})();
</script>
</body>
</html>
